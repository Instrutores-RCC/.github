name: PR padrão

# Workflow reutilizável. Cada repositório chama com .github/workflows/pr.yml:
#
#   on:
#     pull_request:
#     push:
#       branches: [main]
#   permissions:
#     contents: read
#     pull-requests: write
#     issues: write
#   jobs:
#     padrao:
#       uses: Instrutores-RCC/.github/.github/workflows/pr-padrao.yml@main
#       with:
#         teste: "node testes/testa_codigo.js"

on:
  workflow_call:
    inputs:
      teste:
        description: Comando que roda os testes (vazio = sem testes)
        type: string
        default: ""

jobs:
  segredos:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Nenhum segredo ou arquivo proibido no PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          falhou=0
          arquivos=$(git diff --name-only --diff-filter=A "$BASE"...HEAD)
          if echo "$arquivos" | grep -E '(^|/)(ids\.json|\.env(\..*)?|\.clasprc\.json)$' | grep -v '\.env\.exemplo$'; then
            echo "::error::Arquivo proibido no PR (ids.json, .env ou .clasprc.json). Ele vai no .gitignore."
            falhou=1
          fi
          novas=$(git diff -U0 "$BASE"...HEAD | grep '^+' | grep -v '^+++' || true)
          if echo "$novas" | grep -nE 'ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|AIza[0-9A-Za-z_-]{35}|-----BEGIN [A-Z ]*PRIVATE KEY-----|"client_secret"|xox[baprs]-[A-Za-z0-9-]{10,}'; then
            echo "::error::Parece token ou chave no PR. Tire, troque o token e leia SECURITY.md."
            falhou=1
          fi
          if echo "$novas" | grep -qE 'docs\.google\.com/spreadsheets/d/[A-Za-z0-9_-]{25,}'; then
            echo "::warning::Link de planilha no PR. Id de planilha vai no ids.json, não no código."
          fi
          exit $falhou

  testes:
    if: github.event_name == 'pull_request' && inputs.teste != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Rodar testes
        run: ${{ inputs.teste }}

  rotulos:
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Rotular PR pela pasta e marcar a issue como em revisão
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          CORPO: ${{ github.event.pull_request.body }}
        run: |
          pastas=$(gh pr view "$PR" -R "$REPO" --json files --jq '.files[].path')
          add() { gh pr edit "$PR" -R "$REPO" --add-label "$1" >/dev/null 2>&1 || true; }
          echo "$pastas" | grep -q '^design/'  && add area:design
          echo "$pastas" | grep -q '/assets/'  && add area:assets
          echo "$pastas" | grep -q '^script/'  && add area:apps-script
          echo "$pastas" | grep -q '^forum/'   && add area:forum
          echo "$pastas" | grep -q '^testes/'  && add area:testes
          echo "$pastas" | grep -qE '^docs/|\.md$' && ! echo "$pastas" | grep -qvE '^docs/|\.md$' && add tipo:docs
          for n in $(printf '%s' "$CORPO" | grep -oiE '(fecha|closes|fixes|resolve)s? #[0-9]+' | grep -oE '[0-9]+'); do
            gh issue edit "$n" -R "$REPO" --add-label estado:em-revisao \
              --remove-label estado:em-andamento --remove-label estado:pronto-pra-dev >/dev/null 2>&1 || true
          done

  modelo:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Corpo do PR usa o modelo
        env:
          CORPO: ${{ github.event.pull_request.body }}
        run: |
          if ! printf '%s' "$CORPO" | grep -qi 'como testar'; then
            echo "::warning::O PR não tem a seção 'Como testar' do modelo."
          fi

  push-direto:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Avisar se alguém mandou commit direto na main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          QUEM: ${{ github.actor }}
        run: |
          if ! prs=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq 'length'); then
            echo "::warning::Não consegui ver se o commit veio de PR."; exit 0
          fi
          if [ "$prs" = "0" ]; then
            gh issue create -R "$REPO" --label tipo:tarefa --label estado:bloqueado \
              --title "Commit direto na main: ${SHA:0:7}" \
              --body "\`$QUEM\` mandou o commit $SHA direto na main, sem PR. Regra: docs/APROVACAO-PR.md da organização. Revisar o commit e fechar esta issue." || true
            echo "::warning::Commit direto na main sem PR."
          fi
